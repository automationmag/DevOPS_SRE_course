# Пример. Не запускайте этот стек на VPS 1 ГБ / 10 ГБ.
# Нужна машина от 2–4 ГБ или облачная Grafana.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.example.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
  - job_name: pulse-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://pulse.example.ru/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
