# Deployment ≈ сервис pulse в Compose + restart: unless-stopped
# + желание «держи N живых копий» (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      containers:
        - name: pulse
          image: pulse:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulse-config
            - secretRef:
                name: pulse-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulse-data
