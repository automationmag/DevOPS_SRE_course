# Service ≈ внутренняя сеть Compose: имя pulse резолвится в живые Pod.
# ClusterIP — как «без ports: в интернет», только внутри кластера.
apiVersion: v1
kind: Service
metadata:
  name: pulse
  namespace: pulse
spec:
  selector:
    app: pulse
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
