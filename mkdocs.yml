site_name: DevOps и SRE с нуля
site_description: Авторский курс — от своего VPS до продакшена, мониторинга и масштабирования
site_url: https://automationmag.github.io/DevOPS_SRE_course/
repo_url: https://github.com/automationmag/DevOPS_SRE_course
repo_name: DevOPS_SRE_course
use_directory_urls: true

exclude_docs: |
  images/README.md

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.follow
    - toc.integrate
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
  icon:
    logo: material/server
    admonition:
      note: material/book-open-variant
      tip: material/lightbulb
      warning: material/alert
      failure: material/close-octagon
      success: material/check-circle
      info: material/information

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/progress.js
  - path: javascripts/mermaid.js
    type: module

extra:
  generator: false

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

